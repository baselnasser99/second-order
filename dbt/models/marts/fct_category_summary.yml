version: 2

models:
  - name: fct_category_summary
    description: One row per product category, for dashboard page 2. Holds counts and sums, not rates, so each rate is computed as SUM / SUM (late_orders / orders_with_delivery_date, review_score_sum / orders_with_review) and stays correct in any grouping. Every category is kept, including those under 30 orders and unknown, so totals add up; filter on in_rankings for rankings. Order counts across categories add up to more than total orders, because one order can have items in several categories.
    columns:
      - name: product_category
        description: Category in English, else the Portuguese name, else the text unknown, as in fct_order_items.
        data_tests:
          - unique
          - not_null
      - name: orders
        description: Number of distinct orders with at least one item in this category.
        data_tests:
          - not_null
      - name: late_orders
        description: Orders in this category delivered after their estimated date. Each order counts once.
        data_tests:
          - not_null
      - name: orders_with_delivery_date
        description: Orders in this category that have a delivery date, so can be late or on time. Late-order rate = late_orders / orders_with_delivery_date.
        data_tests:
          - not_null
      - name: review_score_sum
        description: Sum of the review scores (1 to 5) of orders in this category, one score per order. NULL when no order has a review. Average review = review_score_sum / orders_with_review.
      - name: orders_with_review
        description: Orders in this category that have a review.
        data_tests:
          - not_null
      - name: order_value
        description: Sum of this category's item prices in BRL, freight not included. Only this category's items count, never the rest of the order, so across all categories it adds up to the sum of fct_orders.items_value.
        data_tests:
          - not_null
      - name: in_rankings
        description: True when the category has at least 30 orders and is not unknown. Rankings use only these rows; totals use all rows.
        data_tests:
          - not_null
