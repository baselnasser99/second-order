repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # v0.17.2, keep in step with ruff in uv.lock
    hooks:
      - id: ruff-check
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
      # The hook above scans only staged changes; CI has none, so it scans the full history instead.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
